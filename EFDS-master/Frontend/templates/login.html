<!DOCTYPE html> 
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Subscribe</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
</head>

<body>
  <video class="background-video" autoplay muted loop> 
    <source src="https://storage.googleapis.com/efds-video-storage/vid2.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>
  <section class="subscribe-section">
    <div class="subscribe-content">
      <h1 class="section-title">Welcome!</h1>
      <h3 class="section-body">Subscribe to receive notifications</h3>
      <form id="subscribeForm" class="form-wrapper" method="POST" action="/subscribe">  
        <div class="input-field email-field">
          <label for="email" class="input-label email-label visually-hidden">Email</label>
          <input type="email" id="email" name="email" aria-label="Email" placeholder="Enter your email" required>
        </div>
   
        <div class="input-field location-field">
          <button type="button" class="location-button" onclick="getLocation()">Get Live Location</button>
          <input type="hidden" id="latitude" name="latitude">
          <input type="hidden" id="longitude" name="longitude">
          <p id="location-status"></p>
        </div>
        
        <button type="submit" class="subscribe-button">
          <span class="subscribe-text">Subscribe</span>
        </button>
      </form>
    </div>
  </section>
  
  <script>    
    async function getLocation() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (position) => {
            document.getElementById("latitude").value = position.coords.latitude;
            document.getElementById("longitude").value = position.coords.longitude;
            document.getElementById("location-status").textContent = "Location captured successfully!";
          }, 
          (error) => {
            document.getElementById("location-status").textContent = "Error getting location. Please enable location services.";
          }
        );
      } else {
        document.getElementById("location-status").textContent = "Geolocation is not supported by this browser.";
      }
    }
    
    document.getElementById('subscribeForm').addEventListener('submit', async function (event) {
      event.preventDefault();
      const formData = new FormData(event.target);
      
      try {
          const response = await fetch('/subscribe', {
              method: 'POST',
              body: formData
          });
          const result = await response.json();
          if (!response.ok) throw new Error(result.message || "Error");
          alert(result.message);
          window.location.href = result.redirect;  
      } catch (error) {
          alert(error.message || "An error occurred. Please try again.");
      }
    });
  </script>
</body>
</html>
