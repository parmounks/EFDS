<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test System</title> 
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='test.css') }}">
</head>
<body>
    <video class="background-video" src="{{ url_for('static', filename='vid2.mp4') }}" muted loop autoplay></video>
  <section class="subscribe-section">
    <div class="content-container">
      <div class="subscribe-content">
        <h3 class="section-body">Select a Province</h3>
        <div class="search-container">  
          <nav class="navbar_search">
            <input type="text" class="search_input" placeholder="Search for Provinces..." id="searchInput">
            <button class="dropdown_icon">&#9660;</button>
            <div class="dropdown_menu" id="provinceDropdown">
              <ul>
                <li><a href="#">Alberta</a></li>
                <li><a href="#">British Columbia</a></li>
                <li><a href="#">Manitoba</a></li>
                <li><a href="#">New Brunswick</a></li>
                <li><a href="#">Newfoundland and Labrador</a></li>
                <li><a href="#">Northwest Territories</a></li>
                <li><a href="#">Nova Scotia</a></li>
                <li><a href="#">Nunavut</a></li>
                <li><a href="#">Ontario</a></li>
                <li><a href="#">Prince Edward Island</a></li>
                <li><a href="#">Quebec</a></li>
                <li><a href="#">Saskatchewan</a></li>
                <li><a href="#">Yukon</a></li>
              </ul>
            </div>
          </nav>
        </div>
        <h3 class="section-body2">Select a Date</h3>
        <div class="calendar-container">
          <input type="date" class="calendar-box">
        </div>
      </div>
    </div>
  </section>

  <script>
  document.querySelector('.dropdown_icon').addEventListener('click', function() {
    document.querySelector('.navbar_search').classList.toggle('active');
  });

  document.addEventListener('DOMContentLoaded', () => {
    const searchInput = document.getElementById('searchInput');
    const dropdownMenu = document.getElementById('provinceDropdown');

    searchInput.addEventListener('input', function() {
      const searchTerm = searchInput.value.toLowerCase();
      const items = dropdownMenu.querySelectorAll('li');
      items.forEach(item => {
        const text = item.textContent.toLowerCase();
        item.style.display = text.includes(searchTerm) ? '' : 'none';
      });
    });
  });
  </script>
</body>
</html>
