<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test System</title> 
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='test.css') }}">
</head>
<body>
    <video class="background-video" autoplay muted loop>
        <source src="https://storage.googleapis.com/efds-video-storage/vid2.mp4" type="video/mp4">
        Your browser does not support the video tag.
      </video>
    <section class="subscribe-section">
        <div class="content-container">
            <div class="subscribe-content">
                <h3 class="section-body">Select a Province</h3>
                <div class="search-container">  
                    <nav class="navbar_search">
                        <input type="text" class="search_input" placeholder="Search for Provinces..." id="searchInput" readonly>
                        <button type="button" class="dropdown_icon" onclick="toggleDropdown()">&#9660;</button>
                        <div class="dropdown_menu" id="provinceDropdown">
                            <ul>
                                <li onclick="selectProvince('Alberta')">Alberta</li>
                                <li onclick="selectProvince('British Columbia')">British Columbia</li>
                                <li onclick="selectProvince('Manitoba')">Manitoba</li>
                                <li onclick="selectProvince('New Brunswick')">New Brunswick</li>
                                <li onclick="selectProvince('Newfoundland and Labrador')">Newfoundland and Labrador</li>
                                <li onclick="selectProvince('Northwest Territories')">Northwest Territories</li>
                                <li onclick="selectProvince('Nova Scotia')">Nova Scotia</li>
                                <li onclick="selectProvince('Nunavut')">Nunavut</li>
                                <li onclick="selectProvince('Ontario')">Ontario</li>
                                <li onclick="selectProvince('Prince Edward Island')">Prince Edward Island</li>
                                <li onclick="selectProvince('Quebec')">Quebec</li>
                                <li onclick="selectProvince('Saskatchewan')">Saskatchewan</li>
                                <li onclick="selectProvince('Yukon')">Yukon</li>
                            </ul>
                        </div>
                    </nav>
                    <input type="hidden" id="selectedProvince">
                </div>
                
                <h3 class="section-body2">Select a Date</h3>
                <div class="calendar-container">
                    <input type="date" class="calendar-box" id="selectedDate">
                </div>

                <button type="submit" class="subscribe-button" onclick="submitSelection()">
                    <span class="subscribe-text">Submit Selection</span>
                </button>
            </div>
        </div>
    </section>
    
    <div class="back-button-container">
        <a href="/" class="back-button">← Back to Main Page</a>
      </div>

    <script>
        function toggleDropdown() {
            const dropdown = document.getElementById("provinceDropdown");
            dropdown.style.display = dropdown.style.display === "block" ? "none" : "block";
        }

        function selectProvince(province) {
            document.getElementById('searchInput').value = province;
            document.getElementById('selectedProvince').value = province;
            document.getElementById('provinceDropdown').style.display = "none"; // Hide dropdown after selection
        }

        function submitSelection() {
            const province = document.getElementById('selectedProvince').value;
            const date = document.getElementById('selectedDate').value;

            if (!province || !date) {
                alert("Please select both a province and a date.");
                return;
            }

            fetch('/save_selection', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ province: province, date: date })
            })
            .then(response => response.json())
            .then(data => {
                alert(data.message);
                // 🔁 Then, call your ML backend (localhost:8080) for fire prediction
                return fetch(`http://127.0.0.1:8080/?_=${Date.now()}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ province: province, date: date })
                });
            })
            .then(response => response.json())
            .then(data => {
                if (data.prediction) {
                    const prediction = data.prediction[0];  // assuming shape [[0.02, 0.98]]
                    const fireProbability = prediction[0];
                    alert(`Fire Probability: ${(fireProbability * 100).toFixed(2)}%`);
                } else {
                    alert(data.message || 'Prediction unavailable');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert("An error occurred. See console for details.");
            });
        }

        // Close dropdown if user clicks outside
        document.addEventListener('click', function(event) {
            const dropdown = document.getElementById('provinceDropdown');
            const searchContainer = document.querySelector('.search-container');

            if (!searchContainer.contains(event.target)) {
                dropdown.style.display = "none";
            }
        });
    </script>
</body>
</html>
