openapi: 3.0.1
info:
  title: Early Fire Detection System API
  description: API for detecting fires using satellite imagery.
  version: 1.0.0
servers:
  - url: https://efds-ai.uc.r.appspot.com
    description: Production server
paths:
  /get_image:
    get:
      summary: Retrieve satellite images
      description: Fetch satellite imagery for a live or specific date.
      parameters:
        - name: type
          in: query
          description: The type of image to fetch, either 'live' for the latest image or 'specific' for a specific date.
          required: true
          schema:
            type: string
            enum: [live, specific]
          example: live
        - name: date
          in: query
          description: The date for the image, required if `type` is 'specific'.
          required: false
          schema:
            type: string
            format: date
            example: 2024-11-15
      responses:
        200:
          description: Satellite image retrieved successfully.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
              example: "(Binary image content)"
        400:
          description: Invalid request, such as missing required parameters.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: "Please provide a valid date for the 'specific' type."
        500:
          description: Server error while fetching the image.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: "Unable to fetch the live image."

  /set_region:
    post:
      summary: Set region for the application
      description: Update the bounding box for satellite imagery by specifying a city.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                city:
                  type: string
                  description: The city name to update the region.
                  example: Toronto
      responses:
        200:
          description: Region successfully updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  bbox:
                    type: string
              example:
                message: "Region set to Toronto"
                bbox: "43.5810,-79.6393,43.8554,-79.1169"
        400:
          description: Invalid or missing city.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: "Invalid or missing city. Available cities are: Toronto, Ottawa, Mississauga."
