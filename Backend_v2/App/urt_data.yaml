apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: efds-backend
spec:
  template:
    spec:
      containers:
        - image: gcr.io/efds-ai/efds-backend
          command:
            - python3
            - urt_data.py
          env:
            - name: DB_PASSWORD
              value: "Fitweball"
          ports:
            - containerPort: 8080
          resources:
            limits:
              memory: "512Mi"
              cpu: "1"
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 240
            timeoutSeconds: 10
            successThreshold: 1
            failureThreshold: 2
