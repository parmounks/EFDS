<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>EFDS Fire Detection Result</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background-color: #f9f9f9;
      color: #333;
    }
    h1 {
      color: #cc0000;
    }
    img {
      max-width: 100%;
      height: auto;
      margin-bottom: 30px;
      border: 2px solid #ccc;
    }
    iframe {
      width: 100%;
      height: 600px;
      border: 1px solid #ccc;
    }
    .alert {
      padding: 20px;
      background-color: #ffe5e5;
      color: #b00000;
      border: 1px solid #b00000;
      border-radius: 8px;
      margin-bottom: 30px;
    }
  </style>
</head>
<body>

  <h1>EFDS Fire Detection Result</h1>

  <h2>🛰️ NASA Satellite Image</h2>
  <img src="{{ image_url }}" alt="Processed Satellite Image">

  {% if no_fires %}
    <div class="alert">
      No high-confidence fires were detected in the selected province on this date.
    </div>
  {% endif %}

  <h2> Detected Fires Map</h2>
  <iframe src="{{ map_url }}"></iframe>

</body>
</html>
