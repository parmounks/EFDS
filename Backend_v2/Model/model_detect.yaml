apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: efds-model
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/client-name: "gcloud"
    spec:
      containers:
        - image: gcr.io/efds-ai/efds-model
          command:
            - python3
            - model_detect.py
          env:
            - name: DB_PASSWORD
              value: "Fitweball"
          ports:
            - containerPort: 8080
          resources:
            limits:
              memory: "2Gi"
              cpu: "1"
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 5
