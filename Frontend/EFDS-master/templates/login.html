<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Subscribe</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
</head>

<body>
  <video class="background" src="{{ url_for('static', filename='video2.mp4') }}" muted loop autoplay></video>
  <section class="subscribe-section">
    <div class="subscribe-content">
      <h1 class="section-title">Welcome!</h1>
      <h3 class="section-body">Subscribe to receive notifications</h3>
      <form id="subscribeForm" class="form-wrapper">
        <div class="input-field email-field">
          <label for="email" class="input-label email-label visually-hidden">Email</label>
          <input type="email" id="email" name="email" aria-label="Email" placeholder="Enter your email" required>
        </div>
        <div class="input-field location-field">
          <button type="button" id="location-button" class="location-button">Get Location</button>
        </div>
        <button type="submit" class="subscribe-button">
          <span class="subscribe-text">Subscribe</span>
        </button>
      </form>
    </div>
  </section>

  <script>
    document.getElementById('location-button').addEventListener('click', function () {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(showPosition, showError);
      } else {
        alert("Geolocation is not supported by this browser.");
      }
    });

    document.getElementById('subscribeForm').addEventListener('submit', async function (event) {
      event.preventDefault();

      const formData = new FormData(event.target);
      const emailInput = document.getElementById('email'); // Get the email input field

      try {
        const response = await fetch('http://127.0.0.1:5000/subscribe', {
          method: 'POST',
          body: formData
        });

        if (response.ok) {
          const result = await response.json();
          alert(result.message + "\n\nPlease go back to the main page. Click OK to continue."); // Show success message with go-back prompt
          emailInput.value = ''; // Clear the email input field
          window.location.href = "/"; // Redirect to the main page
        } else {
          const error = await response.json();
          alert(error.message); // Show an error message if submission fails
        }
      } catch (error) {
        alert("An error occurred while submitting the form. Please try again.");
      }
    });

    function showPosition(position) {
      alert("Latitude: " + position.coords.latitude +
        "\nLongitude: " + position.coords.longitude);
    }

    function showError(error) {
      switch (error.code) {
        case error.PERMISSION_DENIED:
          alert("User denied the request for Geolocation.");
          break;
        case error.POSITION_UNAVAILABLE:
          alert("Location information is unavailable.");
          break;
        case error.TIMEOUT:
          alert("The request to get user location timed out.");
          break;
        case error.UNKNOWN_ERROR:
          alert("An unknown error occurred.");
          break;
      }
    }
  </script>
</body>
</html>
