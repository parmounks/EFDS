<!DOCTYPE html> 
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Subscribe</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
</head>

<body>
  <video class="background" src="{{ url_for('static', filename='vid2.mp4') }}" muted loop autoplay></video>
  <section class="subscribe-section">
    <div class="subscribe-content">
      <h1 class="section-title">Welcome!</h1>
      <h3 class="section-body">Subscribe to receive notifications</h3>
      
      <form id="subscribeForm" class="form-wrapper" method="POST" action="/subscribe">
        <div class="input-field email-field">
          <label for="email" class="input-label email-label visually-hidden">Email</label>
          <input type="email" id="email" name="email" aria-label="Email" placeholder="Enter your email" required>
        </div>
        
        <!-- Location selection-->
        <h2 class="sectionTitle">Select Your locations</h2>
        <div class="categorySelection">
          <div id="categoryContainer"></div>
          <div class="selectedCategories">
            <h3 class="categorySelected">Selected categories:</h3>
            <div id="selectedCategory"></div>
          </div>
        </div>
        <input type="hidden" name="selected_locations" id="selectedLocationsInput">
        <!-- Location selection-->
        
        <button type="submit" class="subscribe-button">
          <span class="subscribe-text">Subscribe</span>
        </button>
      </form>
    </div>
  </section>
  
  <script>
    const category = { 
      subcategories: ["Alberta", "Ontario", "British Columbia"]
    };
    
    const selectedCategory = new Set();
    const categoryContainer = document.getElementById("categoryContainer");
    const selectedCategoryDiv = document.getElementById("selectedCategory");
    const selectedLocationsInput = document.getElementById("selectedLocationsInput");
    
    function renderCategory() {
      categoryContainer.innerHTML = "";
      const categoryColumn = document.createElement("div");
      categoryColumn.classList.add("categoryColumn");
      
      const subcategoryList = document.createElement("ul");
      subcategoryList.classList.add("subcategoryList");
      
      category.subcategories.forEach(subcategory => {
        const listItem = document.createElement("li");
        listItem.classList.add("subcategoryItem");
        
        const label = document.createElement("label");
        label.classList.add("checkboxLabel");
        
        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.classList.add("checkbox");
        checkbox.name = "locations[]";
        checkbox.value = subcategory;
        checkbox.checked = selectedCategory.has(subcategory);
        checkbox.addEventListener("change", () => toggleCategory(subcategory, checkbox));
        
        label.appendChild(checkbox);
        label.appendChild(document.createTextNode(subcategory));
        listItem.appendChild(label);
        subcategoryList.appendChild(listItem);
      });
      
      categoryColumn.appendChild(subcategoryList);
      categoryContainer.appendChild(categoryColumn);
    }
    
    function toggleCategory(subcategory, checkbox) {
      if (checkbox.checked) {
        selectedCategory.add(subcategory);
      } else {
        selectedCategory.delete(subcategory);
      }
      updateSelectedCategory();
    }
    
    function updateSelectedCategory() {
      selectedCategoryDiv.innerHTML = "";
      selectedLocationsInput.value = Array.from(selectedCategory).join(",");
      
      selectedCategory.forEach(subcategory => {
        const chip = document.createElement("span");
        chip.classList.add("categoryChip");
        chip.textContent = subcategory;
        
        const removeButton = document.createElement("button");
        removeButton.classList.add("removeChip");
        removeButton.textContent = "✖";
        removeButton.addEventListener("click", () => {
          selectedCategory.delete(subcategory);
          updateSelectedCategory();
          renderCategory();
        });
        
        chip.appendChild(removeButton);
        selectedCategoryDiv.appendChild(chip);
      });
    }
    
    document.getElementById('subscribeForm').addEventListener('submit', async function (event) {
    event.preventDefault();
    const formData = new FormData(event.target);
    
    try {
        const response = await fetch('/subscribe', {
            method: 'POST',
            body: formData
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.message || "Error");
        alert(result.message);
        window.location.href = result.redirect;  // redirect to home page
    } catch (error) {
        alert(error.message || "An error occurred. Please try again.");
    }
});
    
    renderCategory();
  </script>
</body>
</html>
