<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Subscribe</title>
  <link rel="stylesheet" href="login.css"> 
  <title class="main_page">Main page</title>
</head>
 
<body>
 
        <section class="subscribe-section">
          <h1 class="section-title">Welcome!</h1>
          <h3 class="section-body">Subscribe to receive notification</h3>
          <div class="content-wrapper"></div>
          <form class="form-wrapper">
           
            <div class="input-field username-field">
              <label for="username" class="input-label username-label visually-hidden">Username</label>
              <input type="text" id="username" name="username" aria-label="Username" placeholder="Username">
            </div>
            <div class="input-field password-field">
              <label for="password" class="input-label password-label visually-hidden">Password</label>
              <input type="password" id="password" name="password" aria-label="Password" placeholder="Password">
            </div>
            <div class="input-field location-field">
              <button type="button" id="location-button" class="location-button">Location</button>
            </div>
            <button type="submit" class="subscribe-button">
              <span class="subscribe-text">Subscribe</span>
            </button>
          </form>
         
        </section>
        <body>
          <script>

document.getElementById('location-button').addEventListener('click', function() {
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(showPosition, showError);
  } else {
    alert("Geolocation is not supported by this browser.");
  }
});

function showPosition(position) {
  alert("Latitude: " + position.coords.latitude +
        "\nLongitude: " + position.coords.longitude);
}

function showError(error) {
  switch(error.code) {
    case error.PERMISSION_DENIED:
      alert("User denied the request for Geolocation.");
      break;
    case error.POSITION_UNAVAILABLE:
      alert("Location information is unavailable.");
      break;
    case error.TIMEOUT:
      alert("The request to get user location timed out.");
      break;
    case error.UNKNOWN_ERROR:
      alert("An unknown error occurred.");
      break;
  }
}
          </script>
</html>
